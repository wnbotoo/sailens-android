name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify platform contract
        run: python3 scripts/verify-platform.py

      - name: Build and lint
        run: ./gradlew build lint --stacktrace

      # Unit tests cannot see resource shrinking; this checks the shrunk release APK itself.
      - name: Verify release keeps announcement strings
        run: python3 scripts/verify-release-strings.py

      # The PC tools read what the app writes (captures, traces); keep them in step with the schemas.
      - name: Test PC capture and labelling tools
        run: |
          python3 -m venv /tmp/capture-tools
          /tmp/capture-tools/bin/pip install --quiet -r scripts/capture/requirements.txt
          /tmp/capture-tools/bin/python -m unittest discover -s scripts/capture -v
          /tmp/capture-tools/bin/python -m unittest discover -s scripts -p "test_export_prompt_labels.py" -v
